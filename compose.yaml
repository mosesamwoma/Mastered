services:
  mastered:
    build:
      context: .
      dockerfile: Dockerfile
    image: mastered:local
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      MAX_FILE_MB: "60"
      MAX_DURATION_SEC: "420"
      MAX_PENDING_JOBS: "2"
      JOB_TTL_MINUTES: "20"
      JOB_TIMEOUT_SEC: "1800"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
